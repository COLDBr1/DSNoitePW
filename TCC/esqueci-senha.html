<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unitrigo - Esqueci a Senha</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js" defer></script>
</head>
<body>
    <div class="login-container">
        <div class="login-top">
            <h2>Esqueci a Senha</h2>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Alternar tema" aria-pressed="false">
                <span class="theme-icon" aria-hidden="true">🌙</span>
                <span class="theme-text">Escuro</span>
            </button>
        </div>

        <form class="auth-form">
            <div class="box-login">
                <input type="email" id="email" placeholder="seu@email.com" name="email" required>
            </div>

            <button type="submit" class="btn-login">Enviar link</button>

            <div class="form-footer">
                <a href="index.html">Voltar ao login</a>
            </div>
        </form>
    </div>
</body>
</html>
